# Backup semanal do Supabase: banco (roles, schema e dados) + imagens do Storage.
# O repositório é público, então o pacote é criptografado (GPG/AES256) antes
# de virar artefato. Retenção de 90 dias (máximo do GitHub para repo público).
name: Supabase backup

on:
  schedule:
    # Todo domingo às 03:43 (horário de Fortaleza / 06:43 UTC)
    - cron: "43 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Confere os secrets
        run: |
          missing=0
          for var in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSPHRASE; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var não configurado."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepara pastas
        run: mkdir -p backup/db backup/storage

      - name: Backup das roles
        run: supabase db dump --remote="$SUPABASE_DB_URL" -f backup/db/roles.sql --role-only

      - name: Backup do schema
        run: supabase db dump --remote="$SUPABASE_DB_URL" -f backup/db/schema.sql

      - name: Backup dos dados
        run: >
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/db/data.sql
          --data-only --use-copy
          -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Backup das imagens das notícias
        run: bash scripts/backup/download-storage.sh noticias-imagens backup/storage/noticias-imagens

      - name: Compacta e criptografa
        run: |
          name="supabase-backup-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            -o "$name.tar.gz.gpg" "$name.tar.gz" <<< "$BACKUP_PASSPHRASE"
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
